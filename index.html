    padding: 10px 12px;
    font-size: 1rem;
    line-height: 1.35;

  .opt.bad { background: var(--bad-bg); border-color: var(--bad); }
  .opt:disabled { cursor: default; }

    border-radius: 12px;
    padding: 12px 14px;
    margin: 8px 0 12px;

  .feedback.good { background: var(--ok-bg); color: var(--ink); }
  .feedback.bad { background: var(--bad-bg); color: var(--ink); }

  .sources { font-size: 0.88rem; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {

let view = { name: "menu" };
let progress = {};

function emptyProgress() {
  return { done: {}, picks: {}, quiz: { step: 0, picks: {}, revealed: false, finished: false, score: null } };
}
function loadAll() {
  progress = {};
  READINGS.forEach((r) => {
    try {
      const raw = localStorage.getItem(storeKey(r.id));
      progress[r.id] = raw ? JSON.parse(raw) : emptyProgress();
      if (!progress[r.id].quiz) progress[r.id].quiz = emptyProgress().quiz;
    } catch (e) {
      progress[r.id] = emptyProgress();
    }
  });
}
function save(id) {
  try { localStorage.setItem(storeKey(id), JSON.stringify(progress[id])); } catch (e) {}
}
function readingById(id) { return READINGS.find((r) => r.id === id); }

function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  const btn = document.getElementById("btn-theme");
  if (btn) btn.textContent = theme === "dark" ? "Modo claro" : "Modo oscuro";
  try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
}
function initTheme() {
  let theme = null;
  try { theme = localStorage.getItem(THEME_KEY); } catch (e) {}
  if (theme !== "light" && theme !== "dark") {
    theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  applyTheme(theme);
}

function el(tag, attrs, children) {
  const node = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k, v]) => {
    if (k === "class") node.className = v;
    else if (k === "html") node.innerHTML = v;
    else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v !== null && v !== undefined) node.setAttribute(k, v);
  });
  (children || []).forEach((c) => {
    if (c == null) return;
    node.append(c.nodeType ? c : document.createTextNode(c));
  });
  return node;
}
function p(text) { return el("p", null, [text]); }

function fig(id, cap) {
  return el("figure", { class: "fig" }, [
    el("div", { html: SVG[id] }),
    el("figcaption", null, [cap])
  ]);
}

function renderBlocks(blocks) {
  const wrap = el("div", { class: "prose" });
  blocks.forEach((b) => {
    if (b.t === "p") wrap.append(p(b.x));
    else if (b.t === "h") wrap.append(el("h3", null, [b.x]));
    else if (b.t === "ul") {
      const ul = el("ul", { class: "clean" });
      b.items.forEach((item) => ul.append(el("li", null, [item])));
      wrap.append(ul);
    } else if (b.t === "pairs") {
      const box = el("div", { class: "pairs" });
      b.rows.forEach(([code, name]) => {
        box.append(el("div", { class: "pair" }, [el("b", null, [code]), el("span", null, [name])]));
      });
      wrap.append(box);
    }
  });
  return wrap;
}

function moduleCountDone(r) {
  const pr = progress[r.id];
  return r.modules.filter((m) => pr.done[m.id]).length;
}

function renderMenu() {
  const app = document.getElementById("app");
  app.replaceChildren();
  app.append(
    el("p", { class: "kicker" }, ["Unidad 1"]),
    el("p", { class: "hero-prof" }, ["Profesor Sergio Tertusio"]),
    el("h1", null, ["Contabilidad gubernamental"]),
    el("p", { class: "lede" }, ["Tres lecturas sobre el Manual General de Contabilidad Gubernamental y su Plan General de Cuentas. El avance de cada una se guarda por separado."])
  );
  const grid = el("div", { class: "grid cards" });
  READINGS.forEach((r) => {
    const done = moduleCountDone(r);
    const q = progress[r.id].quiz;
    const totalSteps = r.modules.length + 1;
    const completeUnits = done + (q.finished ? 1 : 0);
    const pct = Math.round((completeUnits / totalSteps) * 100);
    let status = done + " de " + r.modules.length + " módulos";
    if (q.finished) status += " · cuestionario " + q.score + "/10";
    else if (q.step > 0 || q.revealed) status += " · cuestionario en curso";
    else status += " · cuestionario sin iniciar";
    const btn = el("button", { class: "card", type: "button", onClick: () => openReading(r.id) }, [
      el("p", { class: "kicker" }, [r.n]),
      el("h2", null, [r.title]),
      el("p", null, [r.blurb]),
      el("p", { class: "meta" }, [status]),
      el("div", { class: "bar" }, [el("span", { style: "width:" + pct + "%" })])
    ]);
    grid.append(btn);
  });
  app.append(grid);
}

  app.append(
    el("p", { class: "kicker" }, [r.n + " · Módulo " + (idx + 1) + " de " + r.modules.length]),
    el("h1", null, [m.title]),
    el("p", { class: "idea" }, [m.idea])
  );
  if (m.fig) app.append(fig(m.fig, m.cap));
  app.append(renderBlocks(m.blocks));
  app.append(el("h2", null, ["Actividad"]));
  app.append(p(m.activity.prompt));
  const picked = Object.prototype.hasOwnProperty.call(pr.picks, m.id) ? pr.picks[m.id] : null;
  const opts = el("div", { class: "opts" });
  m.activity.options.forEach((text, i) => {
    const chosen = picked === i;
    const show = picked !== null;
    let cls = "opt";
    if (show && i === m.activity.answer) cls += " good";
    else if (show && chosen && i !== m.activity.answer) cls += " bad";
    const b = el("button", {
      class: cls,
      type: "button",
      disabled: show ? "true" : null,
      "aria-pressed": chosen ? "true" : "false"
    }, [text]);
    if (!show) b.addEventListener("click", () => {
      pr.picks[m.id] = i;
      pr.done[m.id] = true;
      save(r.id);
      render();
    });
    opts.append(b);
  });
  app.append(opts);
  if (picked !== null) {
    const ok = picked === m.activity.answer;
    app.append(el("div", { class: "feedback " + (ok ? "good" : "bad") }, [
      el("strong", null, [ok ? "Correcto" : "Incorrecto"]),
      p(m.activity.why)
    ]));
  }
  const nav = el("div", { class: "navline" });
  nav.append(el("button", { class: "btn", type: "button", onClick: () => openReading(r.id) }, ["Volver a la lectura"]));
  if (idx < r.modules.length - 1) {
    const next = r.modules[idx + 1];
    nav.append(el("button", { class: "btn primary", type: "button", onClick: () => openModule(r.id, next.id) }, ["Siguiente módulo"]));
  } else {
    nav.append(el("button", { class: "btn primary", type: "button", onClick: () => openQuiz(r.id) }, ["Ir al cuestionario"]));
  }
  app.append(nav);
}

function renderQuiz() {
  const r = readingById(view.id);
  const pr = progress[r.id];
  const qz = pr.quiz;
  const app = document.getElementById("app");
  app.replaceChildren();
  app.append(el("p", { class: "kicker" }, [r.n + " · Cuestionario"]));
  if (qz.finished) {
    app.append(el("h1", null, ["Resultado"]));
    app.append(el("p", { class: "score" }, [qz.score + " / 10"]));
    let msg = "Varias ideas de esta lectura todavía se confunden. Conviene releer los módulos y reintentar.";
    if (qz.score >= 9) msg = "El resultado muestra que distinguiste las ideas centrales de esta lectura.";
    else if (qz.score >= 7) msg = "Hay una base clara. Revisa las que fallaron con el texto de los módulos.";
    app.append(p(msg));
    const review = el("div", { class: "review" });
    r.quiz.forEach((item, i) => {
      const pick = qz.picks[i];
      const ok = pick === item.a;
      review.append(el("article", null, [
        el("strong", null, [(ok ? "Correcta. " : "Incorrecta. ") + "Pregunta " + (i + 1)]),
        p(item.q),
        p(item.why)
      ]));
    });
    app.append(review);
    app.append(el("div", { class: "navline" }, [
      el("button", { class: "btn primary", type: "button", onClick: () => retryQuiz(r.id) }, ["Reintentar"]),
      el("button", { class: "btn", type: "button", onClick: () => openReading(r.id) }, ["Volver a la lectura"])
    ]));
    return;
  }
  const item = r.quiz[qz.step];
  app.append(el("h1", null, ["Pregunta " + (qz.step + 1) + " de 10"]));
  app.append(p(item.k === "vf" ? "Verdadero o falso" : "Opción múltiple"));
  app.append(el("p", { class: "idea" }, [item.q]));
  const opts = el("div", { class: "opts" });
  item.options.forEach((text, i) => {
    const show = qz.revealed;
    const chosen = qz.picks[qz.step] === i;
    let cls = "opt";
    if (show && i === item.a) cls += " good";
    else if (show && chosen && i !== item.a) cls += " bad";
    const b = el("button", {
      class: cls,
      type: "button",
      disabled: show ? "true" : null,
      "aria-pressed": chosen ? "true" : "false"
    }, [text]);
    if (!show) b.addEventListener("click", () => {
      qz.picks[qz.step] = i;
      qz.revealed = true;
      save(r.id);
      render();
    });
    opts.append(b);
  });
  app.append(opts);
  if (qz.revealed) {
    const ok = qz.picks[qz.step] === item.a;
    app.append(el("div", { class: "feedback " + (ok ? "good" : "bad") }, [
      el("strong", null, [ok ? "Correcto" : "Incorrecto"]),
      p(item.why)
    ]));
    const label = qz.step === r.quiz.length - 1 ? "Ver resultado" : "Siguiente";
    app.append(el("div", { class: "navline" }, [
      el("button", { class: "btn primary", type: "button", onClick: () => advanceQuiz(r) }, [label])
    ]));
  }
}

function advanceQuiz(r) {
  const qz = progress[r.id].quiz;
  if (qz.step >= r.quiz.length - 1) {
    let score = 0;
    r.quiz.forEach((item, i) => { if (qz.picks[i] === item.a) score += 1; });
    qz.finished = true;
    qz.score = score;
    qz.revealed = false;
  } else {
    qz.step += 1;
    qz.revealed = qz.picks[qz.step] !== undefined;
  }
  save(r.id);
  render();
}
function retryQuiz(id) {
  progress[id].quiz = { step: 0, picks: {}, revealed: false, finished: false, score: null };
  save(id);
  render();
}

function render() {
  if (view.name === "menu") renderMenu();
  else if (view.name === "reading") renderReading();
  else if (view.name === "module") renderModule();
  else if (view.name === "quiz") renderQuiz();
  window.scrollTo(0, 0);
}

function resetAll() {
  READINGS.forEach((r) => {
    progress[r.id] = emptyProgress();
    try { localStorage.removeItem(storeKey(r.id)); } catch (e) {}
  });
  document.getElementById("modal").hidden = true;
  view = { name: "menu" };
  render();
}

document.getElementById("btn-menu").addEventListener("click", () => {
  document.getElementById("modal").hidden = true;
  view = { name: "menu" };
  render();
});
document.getElementById("btn-theme").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(cur);
});
document.getElementById("btn-reset").addEventListener("click", () => {
  document.getElementById("modal").hidden = false;
});
document.getElementById("cancel-reset").addEventListener("click", () => {
  document.getElementById("modal").hidden = true;
});
document.getElementById("confirm-reset").addEventListener("click", resetAll);

initTheme();
loadAll();
render();
</script>
</body>
</html>

function esc(s) {
  return String(s)
    .replace(/&/g, "\u0026amp;")
    .replace(/</g, "\u0026lt;")
    .replace(/>/g, "\u0026gt;")
    .replace(/"/g, "\u0026quot;")
    .replace(/'/g, "\u0026#39;");
}
function blank() {
  return { l1: { a: {}, q: null }, l2: { a: {}, q: null }, l3: { a: {}, q: null } };
}
let state = load();
function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY));
    if (!raw || !raw.l1 || !raw.l2 || !raw.l3) return blank();
    return raw;
  } catch (e) {
    return blank();
  }
}
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
function fig(name) {
  return `<div class="figure">${FIGS[name]}<p class="cap">Ilustración original de la lección.</p></div>`;
}
function listHtml(items) {
  if (!items) return "";
  return `<ul>${items.map((i) => `<li>${esc(i)}</li>`).join("")}</ul>`;
}
function paras(arr) {
  return (arr || []).map((p) => `<p>${esc(p)}</p>`).join("");
}
function progressOf(id) {
  const rec = R[id];
  const st = state[id];
  const done = rec.modules.filter((_, i) => st.a[i]).length;
  const answered = st.q && st.q.picks ? Object.keys(st.q.picks).length : 0;
  const finished = answered === rec.quiz.length;
  return { done, total: rec.modules.length, answered, finished, score: finished ? scoreOf(id) : null };
}
function scoreOf(id) {
  const st = state[id].q;
  if (!st) return 0;
  return R[id].quiz.reduce((n, item, i) => n + (st.picks[i] === item.ok ? 1 : 0), 0);
}
function route() {
  const h = (location.hash || "").replace(/^#/, "");
  if (!h) return { view: "home" };
  const p = h.split("/");
  if (!R[p[0]]) return { view: "home" };
  if (p[1] === "m") return { view: "module", id: p[0], n: Math.max(0, parseInt(p[2], 10) || 0) };
  if (p[1] === "quiz") return { view: "quiz", id: p[0] };
  return { view: "reading", id: p[0] };
}
function go(h) {
  const next = h ? "#" + h : "";
  if (location.hash === next || (!h && (location.hash === "" || location.hash === "#"))) {
    render();
    return;
  }
  location.hash = h;
}
function render() {
  const r = route();
  const app = document.getElementById("app");
  if (r.view === "home") app.innerHTML = viewHome();
  else if (r.view === "reading") app.innerHTML = viewReading(r.id);
  else if (r.view === "module") app.innerHTML = viewModule(r.id, r.n);
  else app.innerHTML = viewQuiz(r.id);
  app.querySelectorAll("[data-go]").forEach((b) => {
    b.addEventListener("click", () => go(b.getAttribute("data-go")));
  });
  app.querySelectorAll("[data-act]").forEach((b) => {
    b.addEventListener("click", () => {
      const id = b.getAttribute("data-id");
      const n = b.getAttribute("data-n");
      const pick = Number(b.getAttribute("data-act"));
      if (state[id].a[n]) return;
      const ok = R[id].modules[n].act.ok;
      state[id].a[n] = { pick, right: pick === ok };
      save();
      render();
    });
  });
  app.querySelectorAll("[data-quiz]").forEach((b) => {
    b.addEventListener("click", () => {
      const id = b.getAttribute("data-id");
      const qi = Number(b.getAttribute("data-qi"));
      const oi = Number(b.getAttribute("data-quiz"));
      const q = state[id].q;
      if (q.picks[qi] != null) return;
      q.picks[qi] = oi;
      save();
      render();
    });
  });
  app.querySelectorAll("[data-qnav]").forEach((b) => {
    b.addEventListener("click", () => {
      const id = b.getAttribute("data-id");
      state[id].q.i = Number(b.getAttribute("data-qnav"));
      save();
      render();
    });
  });
  const retry = app.querySelector("[data-retry]");
  if (retry) {
    retry.addEventListener("click", () => {
      const id = retry.getAttribute("data-retry");
      state[id].q = { i: 0, picks: {} };
      save();
      render();
    });
  }
  window.scrollTo(0, 0);
}
function viewHome() {
  const cards = Object.keys(R).map((id) => {
    const rec = R[id];
    const p = progressOf(id);
    const pct = Math.round(((p.done / p.total) * 0.7 + (p.finished ? 0.3 : (p.answered / rec.quiz.length) * 0.3)) * 100);
    const quizTxt = p.finished ? `Cuestionario ${p.score} de 10` : (p.answered ? `Cuestionario en curso (${p.answered} de 10)` : "Cuestionario sin iniciar");
    return `<button class="card" type="button" data-go="${id}">
      ${fig(rec.cover)}
      <div class="pad">
        <p class="kicker">${esc(rec.kicker)}</p>
        <h2>${esc(rec.title)}</h2>
        <p>${esc(rec.blurb)}</p>
        <div class="bar" aria-hidden="true"><span style="width:${pct}%"></span></div>
        <p class="muted">${p.done} de ${p.total} módulos · ${esc(quizTxt)}</p>
      </div>
    </button>`;
  }).join("");
  return `<p class="kicker">Unidad 1</p>
    <h1>Profesor Sergio Tertusio</h1>
    <p class="lead">Tres lecturas para comprender cómo se planifica un encargo: las normas, la estrategia y el detalle, y el memorándum que los deja por escrito. El avance de cada lectura se guarda aparte.</p>
    <div class="grid">${cards}</div>`;
}
function viewReading(id) {
  const rec = R[id];
  const p = progressOf(id);
  const mods = rec.modules.map((m, i) => {
    const done = !!state[id].a[i];
    return `<button class="mod${done ? " done" : ""}" type="button" data-go="${id}/m/${i}">
      <span class="num">${done ? "✓" : i + 1}</span>
      <span><strong>${esc(m.title)}</strong><br><span class="muted">${done ? "Actividad hecha" : "Lectura y actividad breve"}</span></span>
    </button>`;
  }).join("");
  const quizLabel = p.finished ? `Cuestionario · ${p.score} de 10` : "Cuestionario de 10 preguntas";
  return `${fig(rec.cover)}
    <p class="kicker">${esc(rec.kicker)}</p>
    <h2>${esc(rec.title)}</h2>

    <div class="panel" style="box-shadow:none;margin-top:1rem">

      <button class="mod" type="button" data-go="${id}/quiz"><span class="num">Q</span><span><strong>${esc(quizLabel)}</strong><br><span class="muted">Opción múltiple y verdadero o falso, con explicación al momento</span></span></button>
    </div>`;
}
function block(title, items) {
  if (!items) return "";
  return `${title ? `<h3>${esc(title)}</h3>` : ""}${listHtml(items)}`;
}
function viewModule(id, n) {
  const rec = R[id];
  const m = rec.modules[n];
  if (!m) return viewReading(id);
  const st = state[id].a[n];
  const opts = m.act.options.map((o, i) => {
    let cls = "opt";
    if (st) {
      if (i === m.act.ok) cls += " good";
      else if (i === st.pick) cls += " bad";
    }
    return `<button type="button" class="${cls}" data-act="${i}" data-id="${id}" data-n="${n}" ${st ? "disabled" : ""}>${esc(o)}</button>`;
  }).join("");
  const why = st ? `<div class="why ${st.right ? "ok" : "no"}"><strong>${st.right ? "Correcto." : "No es esa."}</strong> ${esc(m.act.why)}</div>` : "";
  const prev = n > 0 ? `<button type="button" data-go="${id}/m/${n - 1}">Módulo anterior</button>` : "";
  const next = n < rec.modules.length - 1
    ? `<button type="button" class="primary" data-go="${id}/m/${n + 1}">Módulo siguiente</button>`
    : `<button type="button" class="primary" data-go="${id}/quiz">Ir al cuestionario</button>`;
  return `<p class="kicker">${esc(rec.kicker)} · Módulo ${n + 1} de ${rec.modules.length}</p>
    <h2>${esc(m.title)}</h2>
    ${fig(m.fig)}
    ${paras(m.paras)}
    ${block(m.listTitle, m.list)}
    ${m.after ? `<p>${esc(m.after)}</p>` : ""}
    ${block(m.list2Title, m.list2)}
    ${m.end ? `<p>${esc(m.end)}</p>` : ""}
    <div class="panel">
      <h3>Actividad</h3>
      <p>${esc(m.act.q)}</p>
      ${opts}
      ${why}
    </div>
    <div class="row">
      <button type="button" data-go="${id}">Lista de la lectura</button>
      ${prev}
      ${next}
    </div>`;
}
function viewQuiz(id) {
  const rec = R[id];
  if (!state[id].q) state[id].q = { i: 0, picks: {} };
  const qstate = state[id].q;
  if (qstate.i >= rec.quiz.length) {
    const score = scoreOf(id);
    const note = score === 10
      ? "Las ideas de esta lectura quedaron claras."
      : score >= 7
        ? "Hay una base sólida. Conviene releer la explicación de las que no acertaste."
        : "Conviene volver a los módulos y reintentar el cuestionario con esas ideas a la vista.";
    return `<p class="kicker">${esc(rec.kicker)} · Cuestionario</p>
      <h2>Resultado</h2>
      <p class="score">${score} de 10</p>
      <p>${esc(note)}</p>
      <div class="row">
        <button type="button" class="primary" data-retry="${id}">Reintentar</button>
        <button type="button" data-go="${id}">Volver a la lectura</button>
      </div>`;
  }
  const item = rec.quiz[qstate.i];
  const picked = qstate.picks[qstate.i];
  const opts = item.options.map((o, i) => {
    let cls = "opt";
    if (picked != null) {
      if (i === item.ok) cls += " good";
      else if (i === picked) cls += " bad";
    }
    return `<button type="button" class="${cls}" data-quiz="${i}" data-qi="${qstate.i}" data-id="${id}" ${picked != null ? "disabled" : ""}>${esc(o)}</button>`;
  }).join("");
  const why = picked == null ? "" : `<div class="why ${picked === item.ok ? "ok" : "no"}"><strong>${picked === item.ok ? "Correcto." : "No es esa."}</strong> ${esc(item.why)}</div>`;
  const prev = qstate.i > 0 ? `<button type="button" data-qnav="${qstate.i - 1}" data-id="${id}">Anterior</button>` : "";
  const next = picked == null ? "" : (
    qstate.i < rec.quiz.length - 1
      ? `<button type="button" class="primary" data-qnav="${qstate.i + 1}" data-id="${id}">Siguiente</button>`
      : `<button type="button" class="primary" data-qnav="${rec.quiz.length}" data-id="${id}">Ver resultado</button>`
  );
  return `<p class="kicker">${esc(rec.kicker)} · Pregunta ${qstate.i + 1} de 10</p>
    <h2>${esc(item.q)}</h2>
    ${opts}
    ${why}
    <div class="row">${prev}${next}<button type="button" data-go="${id}">Volver a la lectura</button></div>`;
}

function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  localStorage.setItem(THEME, t);
  const btn = document.getElementById("theme");
  const dark = t === "dark";
  btn.textContent = dark ? "Modo oscuro" : "Modo claro";
  btn.setAttribute("aria-pressed", dark ? "true" : "false");
  btn.setAttribute("aria-label", dark ? "Cambiar a modo claro" : "Cambiar a modo oscuro");
}
const savedTheme = localStorage.getItem(THEME);
applyTheme(savedTheme || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
document.getElementById("theme").addEventListener("click", () => {
  applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
});
document.getElementById("menu").addEventListener("click", () => go(""));
document.getElementById("reset").addEventListener("click", () => document.getElementById("dlg").showModal());
document.getElementById("dlg-no").addEventListener("click", () => document.getElementById("dlg").close());
document.getElementById("dlg-yes").addEventListener("click", () => {
  localStorage.removeItem(KEY);
  state = blank();
  document.getElementById("dlg").close();
  go("");
});
window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
